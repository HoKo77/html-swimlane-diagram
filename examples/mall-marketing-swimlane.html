<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商城后台营销活动泳道图</title>
  <style>
    :root {
      --blue: #416bb3;
      --blue-dark: #315596;
      --line: #8fb0ee;
      --grid: #6f92d6;
      --paper: #fbfdff;
      --ink: #1f3763;
      --lane-width: 211.25px;
      --phase-width: 70px;
      --header-height: 126px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #e9eef8;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    .page {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .canvas-shell {
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background: white;
    }

    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 10;
      width: var(--canvas-width);
      height: var(--header-height);
      margin: 0 auto calc(var(--header-height) * -1);
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0;
      box-shadow: 0 2px 0 rgba(49, 85, 150, 0.35);
    }

    .sticky-title {
      height: 70px;
      display: flex;
      align-items: center;
      padding-left: 22px;
      background: var(--blue);
      font-size: 22px;
    }

    .sticky-lanes {
      height: 56px;
      display: grid;
      grid-template-columns: var(--phase-width) repeat(var(--lane-count), var(--lane-width));
      background: var(--blue-dark);
      border-bottom: 1.25px solid var(--grid);
    }

    .sticky-lanes div {
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 1.25px solid var(--grid);
      font-size: 15px;
    }

    .sticky-lanes div:last-child { border-right: 1.25px solid var(--grid); }

    svg {
      display: block;
      width: var(--canvas-width);
      height: var(--canvas-height);
      max-width: none;
      margin: 0 auto;
      background: var(--paper);
    }

    .title-band { fill: var(--blue); }
    .lane-head, .phase-head { fill: var(--blue-dark); }
    .phase-fill { fill: #eef4ff; }
    .grid-line {
      stroke: var(--grid);
      stroke-width: 1.25;
      vector-effect: non-scaling-stroke;
    }
    .phase-divider {
      stroke: var(--grid);
      stroke-width: 1.6;
      vector-effect: non-scaling-stroke;
    }
    .node {
      fill: var(--blue);
      stroke: #315a9f;
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
    }
    .node.alt { fill: #5f7fbd; }
    .start-end { rx: 24; ry: 24; }
    .diamond {
      fill: #365f9f;
      stroke: #284f8d;
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
    }
    .node-text, .head-text, .phase-text, .title-text, .subtitle-text, .link-label {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }
    .title-text {
      fill: #ffffff;
      font-size: 22px;
      font-weight: 700;
    }
    .subtitle-text {
      fill: #dbe8ff;
      font-size: 12px;
      font-weight: 500;
    }
    .head-text {
      fill: #eef4ff;
      font-size: 15px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .phase-text {
      fill: #eef4ff;
      font-size: 16px;
      font-weight: 700;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .node-text {
      fill: #ffffff;
      font-size: 13px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .note-text {
      fill: #476aa8;
      font-size: 12px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .link {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.8;
      vector-effect: non-scaling-stroke;
      marker-end: url(#arrow);
    }
    .arrow-head {
      fill: var(--blue);
      stroke: none;
    }
    .link-label {
      fill: #5175ba;
      font-size: 12px;
      text-anchor: middle;
      dominant-baseline: middle;
      paint-order: stroke;
      stroke: var(--paper);
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    @media print {
      body { background: white; overflow: visible; }
      .page, .canvas-shell { width: auto; height: auto; overflow: visible; }
      .sticky-header { display: none; }
      svg { margin: 0; }
    }
  </style>
</head>
<body>
  <main class="page" style="--lane-count: 5; --canvas-width: 1126px; --canvas-height: 1700px;">

          <div>商品/库存</div>
          <div>设计/内容</div>
          <div>运营主管</div>
          <div>客服/数据</div>

      </header>

        <rect class="title-band" x="0" y="0" width="1126" height="70"></rect>

        <rect class="node" x="947.5" y="1168" width="146" height="58"></rect>
        <text class="node-text" x="1020.5" y="1191">
          <tspan x="1020.5" dy="0">监控数据与反馈</tspan>
          <tspan x="1020.5" dy="17">流量/转化/客诉</tspan>
        </text>

        <polygon class="diamond" points="809.375,1284 879.375,1329 809.375,1374 739.375,1329"></polygon>
        <text class="node-text" x="809.375" y="1322">
          <tspan x="809.375" dy="0">是否异常?</tspan>

        </text>

        <rect class="node alt" x="525.125" y="1304" width="146" height="50"></rect>
        <text class="node-text" x="598.125" y="1329">调整或暂停活动</text>

        <rect class="node" x="102.625" y="1448" width="146" height="58"></rect>
        <text class="node-text" x="175.625" y="1471">
          <tspan x="175.625" dy="0">活动下线</tspan>

  </main>
  <script>
    window.swimlaneDiagram = window.swimlaneDiagram || { nodes: [], edges: [] };
  </script>
</body>
</html>
